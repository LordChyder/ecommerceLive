<section class="categories" aria-labelledby="categories-title">
  <div class="section-inner">
    <h2 id="categories-title" class="categories__title">Encuentra tu siguiente upgrade</h2>

    <ul class="categories__grid">
      @for (category of categories; track category.label) {
        <li>
          <a href="#" class="category-card">
            <span class="category-card__icon" aria-hidden="true">
              @switch (category.icon) {
                @case ('laptop') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M2 18h20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                }
                @case ('desktop') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M17 8h5v8h-5z" stroke="currentColor" stroke-width="1.6"/><path d="M6 18h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                }
                @case ('component') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                }
                @case ('accessory') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M6 10V6a6 6 0 0 1 12 0v4" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="10" width="6" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="15" y="10" width="6" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
                }
                @case ('peripheral') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="16" rx="5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                }
                @case ('service') {
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a3 3 0 0 1-3.8 3.8L5 16l3 3 5.9-5.9a3 3 0 0 1 3.8-3.8l2.1-2.1-2.1-2.1-3 2.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                }
              }
            </span>
            <span class="category-card__label">{{ category.label }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
