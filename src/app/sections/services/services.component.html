<section class="services" aria-labelledby="services-title">
  <div class="section-inner">
    <h2 id="services-title" class="services__title">Expertos en tecnología.<br />Aliados en cada paso.</h2>

    <div class="services__row">
      <div class="services__photo-col">
        <img
          class="services__photo"
          src="https://placehold.co/640x440/2a2d33/ffffff?text=Soporte+T%C3%A9cnico"
          alt="Técnico reparando un equipo (imagen genérica de referencia)"
          loading="lazy"
          width="640"
          height="440"
        />
        <a href="#" class="btn btn-primary-dark">Conocer servicios</a>
      </div>

      <ol class="services__list">
        @for (item of items; track item.number) {
          <li>
            <span class="services__number">{{ item.number }}</span>
            <div>
              <h3 class="services__item-title">{{ item.title }}</h3>
              <p class="services__item-description">{{ item.description }}</p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
